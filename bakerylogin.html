<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
body{
background: linear-gradient(135deg,#4e3817,#e1bb80);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
font-family:Arial, sans-serif;
}

.login-box{
width:100%;
max-width:420px;
background:#fff;
padding:40px;
border-radius:15px;
box-shadow:0 10px 25px rgba(0,0,0,.25);
}

.login-box h2{
text-align:center;
margin-bottom:30px;
color:#000000;
font-weight:bold;
}

.form-control{
height:50px;
border-radius:10px;
}

.btn-login{
width:100%;
height:50px;
background:#352208;
color:#fff;
border:none;
border-radius:10px;
font-weight:bold;
transition:.3s;
}

.btn-login:hover{
background:#352208;
}

.register{
text-align:center;
margin-top:20px;
}

.register a{
text-decoration:none;
color:#4e3817;
font-weight:bold;
}

.register a:hover{
text-decoration:underline;
}
</style>
</head>
<body>

    <div class="login-box">

<h2>Login</h2>

<form>

<div class="mb-3">
<label class="form-label">Email Address</label>
<input type="email" class="form-control" placeholder="Enter your email">
</div>

<div class="mb-4">
<label class="form-label">Password</label>
<input type="password" class="form-control" placeholder="Enter your password">
</div>

<button type="submit" class="btn btn-login">
Login
</button>

</form>

<div class="register">
Don't have an account?
<a href="bakeryregister.html">Register Account</a>
<br>
Back to <a href="index.html">Home</a>
</div>

</div>
    
</body>
</html>
